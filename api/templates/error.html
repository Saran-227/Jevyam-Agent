<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} | Jevyam Technologies</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-color: #1f2937;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .error-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 36px 28px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .brand-title {
            font-size: 13px;
            letter-spacing: 2px;
            font-weight: 700;
            color: #60a5fa;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .icon-circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background-color: rgba(239, 68, 68, 0.1);
            color: #f87171;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px auto;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .error-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .error-message {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .notice-box {
            background: #1e293b;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="error-card">
    <div class="brand-title">Jevyam Technologies</div>
    <div class="icon-circle">🔒</div>
    <h1 class="error-title">{{title}}</h1>
    <p class="error-message">{{message}}</p>
    <div class="notice-box">
        If you believe this is an error, please check for a newer approval link in your notifications.
    </div>
</div>

</body>
</html>
