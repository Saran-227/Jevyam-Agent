<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Post Approval | Jevyam Technologies</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-color: #1f2937;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --accent-red: #ef4444;
            --accent-red-hover: #dc2626;
            --tag-bg: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 680px;
            margin-top: 12px;
            margin-bottom: 40px;
        }

        /* Header */
        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-title {
            font-size: 14px;
            letter-spacing: 2.5px;
            font-weight: 700;
            color: #60a5fa;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .post-meta-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
            font-size: 13px;
        }

        .badge {
            background-color: var(--tag-bg);
            color: #93c5fd;
            padding: 4px 10px;
            border-radius: 9999px;
            font-weight: 600;
            border: 1px solid #334155;
        }

        .badge-revision {
            background-color: #312e81;
            color: #c7d2fe;
            border-color: #4338ca;
        }

        /* Card */
        .content-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }

        .section-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .topic-text {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.4;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .angle-text {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 18px;
            font-style: italic;
        }

        /* Visual Box */
        .visual-container {
            margin-bottom: 20px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2d3748;
            background-color: #0f172a;
        }

        .image-preview {
            width: 100%;
            height: auto;
            max-height: 380px;
            object-fit: cover;
            display: block;
        }

        .visual-placeholder {
            padding: 20px;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            border-radius: 12px;
        }

        .visual-placeholder-header {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #818cf8;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .visual-concept-body {
            font-size: 14px;
            color: #e2e8f0;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .visual-specs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 12px;
            color: var(--text-secondary);
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 8px;
        }

        /* Post Caption */
        .caption-box {
            background-color: #090d16;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 18px;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            color: #f1f5f9;
        }

        .hook-highlight {
            font-weight: 700;
            color: #67e8f9;
            margin-bottom: 10px;
            display: block;
        }

        .hashtags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 18px;
        }

        .hashtag-pill {
            background-color: #1e293b;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .cta-box {
            background-color: rgba(59, 130, 246, 0.1);
            border-left: 3px solid var(--accent-blue);
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 13px;
            color: #bfdbfe;
            margin-bottom: 20px;
        }

        /* Rejection Feedback Box */
        .rejection-input-group {
            margin-bottom: 20px;
            display: none;
        }

        .rejection-textarea {
            width: 100%;
            background-color: #0b0f19;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 12px;
            color: var(--text-primary);
            font-size: 14px;
            resize: vertical;
            min-height: 80px;
            outline: none;
            margin-top: 6px;
        }

        .rejection-textarea:focus {
            border-color: var(--accent-red);
        }

        /* Action Buttons */
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        @media (max-width: 480px) {
            .button-grid {
                grid-template-columns: 1fr;
            }
        }

        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 16px 20px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            width: 100%;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            pointer-events: none;
        }

        .btn-approve {
            background-color: var(--accent-green);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
        }

        .btn-approve:hover:not(:disabled) {
            background-color: var(--accent-green-hover);
            transform: translateY(-1px);
        }

        .btn-reject {
            background-color: #27272a;
            color: #f87171;
            border: 1px solid #7f1d1d;
        }

        .btn-reject:hover:not(:disabled) {
            background-color: #3f1d1d;
            color: #fca5a5;
        }

        .btn-confirm-reject {
            background-color: var(--accent-red);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
            margin-top: 8px;
        }

        .btn-confirm-reject:hover:not(:disabled) {
            background-color: var(--accent-red-hover);
        }

        /* Status Toast / Alerts */
        .status-alert {
            display: none;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            font-size: 15px;
            margin-top: 16px;
            line-height: 1.5;
        }

        .alert-success {
            background-color: #064e3b;
            color: #a7f3d0;
            border: 1px solid #059669;
        }

        .alert-loading {
            background-color: #1e1b4b;
            color: #c7d2fe;
            border: 1px solid #4338ca;
        }

        .alert-error {
            background-color: #450a0a;
            color: #fecaca;
            border: 1px solid #b91c1c;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <header class="brand-header">
        <div class="brand-title">Jevyam Technologies</div>
        <h1 class="page-title">LinkedIn Post Approval</h1>
        <div class="post-meta-bar">
            <span class="badge" id="post-id-badge">{{post_id}}</span>
            <span class="badge badge-revision" id="revision-badge">Revision #{{revision_number}}</span>
            <span class="badge" style="background:#1e293b; color:#cbd5e1;">{{content_type}}</span>
        </div>
    </header>

    <main class="content-card">
        <div class="section-label">Target Audience & Topic</div>
        <div class="topic-text">{{topic}}</div>
        <div class="angle-text">{{angle}}</div>

        <!-- Companion Visual Section -->
        <div class="section-label">Companion Visual</div>
        <div class="visual-container">
            {{visual_block}}
        </div>

        <!-- Post Content Section -->
        <div class="section-label">LinkedIn Caption</div>
        <div class="caption-box">
            <span class="hook-highlight">📌 Hook: {{hook}}</span>
            <div id="caption-body">{{caption}}</div>
        </div>

        <!-- Hashtags -->
        <div class="section-label">Hashtags</div>
        <div class="hashtags-container">
            {{hashtags_block}}
        </div>

        <!-- Call to Action -->
        <div class="cta-box">
            <strong>Discussion Prompt:</strong> {{call_to_action}}
        </div>

        <!-- Optional Rejection Reason Input -->
        <div class="rejection-input-group" id="rejection-form">
            <label class="section-label" for="rejection-reason" style="color:#f87171;">Reason for Rejection (Optional for AI guidance):</label>
            <textarea id="rejection-reason" class="rejection-textarea" placeholder="E.g. Make it more technical, focus on security bottlenecks, or change the opening hook..."></textarea>
            <button id="btn-submit-reject" class="btn btn-confirm-reject" onclick="executeReject()">
                🔄 Regenerate with Feedback
            </button>
        </div>

        <!-- Action Buttons -->
        <div class="button-grid" id="action-buttons-grid">
            <button id="btn-approve" class="btn btn-approve" onclick="executeApprove()">
                <span>✓ YES — PUBLISH</span>
            </button>
            <button id="btn-reject-toggle" class="btn btn-reject" onclick="toggleRejectForm()">
                <span>✕ NO — REGENERATE</span>
            </button>
        </div>

        <!-- Feedback & Transition Status Notifications -->
        <div id="status-toast" class="status-alert"></div>
    </main>
</div>

<script>
    const TOKEN = "{{approval_token}}";
    let isProcessing = false;

    function toggleRejectForm() {
        const form = document.getElementById("rejection-form");
        if (form.style.display === "block") {
            // If already open, submit immediately without waiting
            executeReject();
        } else {
            form.style.display = "block";
            document.getElementById("btn-reject-toggle").innerText = "✕ Cancel Feedback";
            document.getElementById("rejection-reason").focus();
        }
    }

    function showStatus(message, type, showSpinner = false) {
        const toast = document.getElementById("status-toast");
        toast.className = `status-alert alert-${type}`;
        toast.style.display = "block";

        if (showSpinner) {
            toast.innerHTML = `<span class="spinner"></span> <span>${message}</span>`;
        } else {
            toast.innerHTML = message;
        }
    }

    function disableButtons() {
        isProcessing = true;
        document.querySelectorAll(".btn").forEach(btn => btn.disabled = true);
    }

    async function executeApprove() {
        if (isProcessing) return;
        disableButtons();

        showStatus("Submitting approval...", "loading", true);

        try {
            const response = await fetch(`/approve/${TOKEN}/yes`, {
                method: "POST",
                headers: { "Content-Type": "application/json" }
            });

            const data = await response.json();

            if (response.ok) {
                document.getElementById("action-buttons-grid").style.display = "none";
                const form = document.getElementById("rejection-form");
                if (form) form.style.display = "none";

                showStatus("🎉 Post approved successfully! Marked ready for scheduled publishing.", "success");
            } else {
                showStatus(data.message || data.detail || "Approval failed.", "error");
            }
        } catch (err) {
            showStatus("Network error submitting approval. Please retry.", "error");
        }
    }

    async function executeReject() {
        if (isProcessing) return;
        disableButtons();

        const reason = document.getElementById("rejection-reason").value.trim();
        showStatus("AI is generating a fresh revision... Please wait 5-10 seconds.", "loading", true);

        try {
            const response = await fetch(`/approve/${TOKEN}/no`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ reason: reason || null })
            });

            const data = await response.json();

            if (response.ok && data.approval_url) {
                showStatus("✨ New revision generated successfully! Redirecting to review...", "success");
                setTimeout(() => {
                    window.location.href = data.approval_url;
                }, 1500);
            } else if (response.ok) {
                showStatus(data.message || "Post rejected and queued for regeneration.", "success");
            } else {
                showStatus(data.message || data.detail || "Regeneration request failed.", "error");
            }
        } catch (err) {
            showStatus("Network error requesting regeneration. Please retry.", "error");
        }
    }
</script>

</body>
</html>
