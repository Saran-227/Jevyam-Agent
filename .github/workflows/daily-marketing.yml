name: Daily Marketing Agent (Post Generation & Telegram Preview)

on:
  schedule:
    # 03:30 UTC = 09:00 AM IST (Indian Standard Time)
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force new post generation even if today already completed'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Run in mock/dry-run mode (safe: no real Telegram or LinkedIn dispatches)'
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-marketing-generation
  cancel-in-progress: false

jobs:
  generate-daily-post:
    name: Generate Post & Deliver Telegram Preview
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies for Image Rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfreetype6-dev libjpeg-dev zlib1g-dev fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Marketing Generation Cycle
        env:
          # Production Core Settings
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          LINKEDIN_MOCK_PUBLISHING: 'false'
          AUTO_PUBLISH_ON_APPROVAL: 'true'
          APPROVAL_PROVIDER: 'telegram'
          TIMEZONE: 'Asia/Kolkata'

          # Cloud Persistent Storage (Supabase)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_IMAGE_BUCKET: 'post-images'

          # AI Content Generation (Gemini)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # Telegram Delivery & Strict Founder Authorization
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_FOUNDER_CHAT_ID: ${{ secrets.TELEGRAM_FOUNDER_CHAT_ID || '8164283098' }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}

          # LinkedIn Production Configuration
          LINKEDIN_ORGANIZATION_ID: ${{ secrets.LINKEDIN_ORGANIZATION_ID || '108376955' }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_API_VERSION: '202610'
        run: |
          FLAGS="--provider telegram"
          if [ "${{ inputs.force }}" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          else
            FLAGS="$FLAGS --live"
          fi
          echo "Executing: python scripts/daily_run.py $FLAGS"
          python scripts/daily_run.py $FLAGS

