name: Jevyam Daily AI Marketing Agent

on:
  schedule:
    # 03:30 UTC every day -> 09:00 AM Indian Standard Time (IST, UTC+5:30)
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode (mock or live)"
        required: true
        default: "mock"
        type: choice
        options:
          - mock
          - live
      force:
        description: "Bypass daily idempotency guard to force create a new post"
        required: false
        default: false
        type: boolean

jobs:
  daily-agent:
    name: Run Daily Content Agent
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pre-flight test verification
        run: |
          python -m pytest tests/test_database_models.py tests/test_knowledge.py -q

      - name: Execute Jevyam Daily Marketing Agent
        env:
          # AI & Content Generation
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}

          # Database & Persistence (Supabase)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

          # LinkedIn Publishing (Company Page)
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORGANIZATION_ID: ${{ secrets.LINKEDIN_ORGANIZATION_ID }}
          AUTO_PUBLISH_ON_APPROVAL: "true"

          # WhatsApp Approval Notification Layer
          WHATSAPP_PROVIDER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'live' && 'meta' || 'mock' }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_BUSINESS_ACCOUNT_ID: ${{ secrets.WHATSAPP_BUSINESS_ACCOUNT_ID }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN || 'jevyam_verify_token' }}
          WHATSAPP_FOUNDER_PHONE: ${{ secrets.WHATSAPP_FOUNDER_PHONE }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}

          # Application & Environment Settings
          APP_BASE_URL: ${{ vars.APP_BASE_URL || 'http://localhost:8000' }}
          APP_ENV: production
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'live' && 'false' || 'true' }}
        run: |
          RUN_MODE="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'live' && '--live' || '--dry-run' }}"
          FORCE_FLAG="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force == true && '--force' || '' }}"
          python scripts/daily_run.py $RUN_MODE $FORCE_FLAG
